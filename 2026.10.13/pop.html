<html>

<body>
    <h2>Array 객체의 pop() 함수</h2>

    <p>초기 배열 : ["html", "css", "javascript"]</p>

    <button onclick="deleteArray()">맨 뒤 요소 삭제</button>

    <h3>실행 결과</h3>
    <div id="result"></div>

    <script>
        var study = ["html", "css", "javascript"];

        function deleteArray() {
            // 배열의 맨 뒤 요소 삭제
            var item = study.pop();
            //삭제된 요소의 값을 반환
            var str = "";
            str += "삭제된 요소 : " + item + "<br>";
            str += "남은 배열 : " + study + "<br>";
            str += "배열 요소 개수 : " + study.length;

            document.getElementById("result").innerHTML = str;
        }
    </script>
</body>
</html>
