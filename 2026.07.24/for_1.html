<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자적기</title>
</head>

<body>
    <script>
        let t = 1000;
        for (let i = 0; i < 10; i++) {
            setTimeout(() => document.write(i), t * i);
        }
    </script>
</body>

</html>
