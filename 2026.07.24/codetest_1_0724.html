<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = 0;
        let x = parseInt(prompt("숫자를 입력하세요", "0"));
        for (i = 0; i <= x; i++) {
            n = n + i;
        }
        document.write("for문 이용: " + n + "<br>" + "<hr>");

        let i2 = 0;
        n = 0;
        while (i2 <= x) {
            n = n + i2;
            i2++;
        }
        document.write("while문 이용: " + n + "<br>");
    </script>
</body>

</html>
