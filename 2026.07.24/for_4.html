<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별찍기</title>
</head>

<body>
    <script>
        let t = 1000;
        for (let i = 1; i <= 5; i++) {
            for (let k = 5-i; k > 0; k--) {
                document.write("&nbsp;")
            }
            for (let j = 1; j <= i; j++) {
                    document.write("*")
                }
            document.write("<br>")
        }
    </script>
</body>

</html>
