<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font 사이즈 바꾸기</title>
</head>

<body>
    <h3>for문 이용</h3>
    <hr>
    <script>
        for (let size = 10; size <= 35; size = size + 5) {
            document.write("<span style='font-size:" + size + "px'>")
            document.write(size + "px");
            document.write("</span>");
        }
    </script>
</body>

</html>
